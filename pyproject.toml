[project]
name = "invoice-agent"
version = "0.1.0"
description = "Agentic invoice-processing showcase built on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Benedikt Vennen" }
]
dependencies = [
    "claude-agent-sdk>=0.1",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "faker>=27",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent", "data_generator"]
